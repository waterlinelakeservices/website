<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Check-in and winterization | Waterline Lake Services</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#134E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winterize">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --deep: #134E5E; --deep-dark: #0C3944; --pine: #2F5D50; --glacier: #8CC7D6;
  --glacier-tint: rgba(140,199,214,0.18); --stone: #E8ECEF; --stone-2: #DCE3E6; --white: #FFFFFF;
  --ink: #16232B; --paper: #FFFFFF; --muted: #6A7480; --wash: #F2F9FA; --sun: #E7A24C;
  /* working colors for this tool */
  --sun-tint: #FBF0DE; --sun-ink: #8A5A17; --pine-tint: #E6EFEC; --na-tint: #EEF1F2; --danger: #A8433A;
  --grad: linear-gradient(160deg, var(--deep) 0%, var(--deep-dark) 60%, var(--pine) 130%);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--stone); color: var(--ink); font: 16px/1.55 'Work Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--glacier); outline-offset: 2px; }
img { max-width: 100%; display: block; }
h1, h2, h3, .voice { font-family: 'Fraunces', Georgia, serif; font-weight: 500; line-height: 1.2; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 128px; }
@media (min-width: 820px) { .wrap { max-width: 900px; padding: 0 28px 128px; } }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hide { display: none !important; }

/* header */
.top { background: var(--grad); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top .in { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top .brand { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.top .brand svg { width: 30px; height: 30px; flex: none; }
.top .brand b { font: 500 20px 'Fraunces', Georgia, serif; }
.top .brand span { font-size: 13px; color: var(--glacier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 { font-size: 20px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { background: none; border: 0; color: #fff; font-size: 30px; line-height: 1; padding: 4px 10px 6px 0; }
.top .who-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(140,199,214,.5); color: #fff; border-radius: 30px; padding: 6px 12px; font-size: 13px; }
.saving { font-size: 12.5px; color: var(--glacier); white-space: nowrap; }
.rule { height: 5px; background: var(--deep-dark); position: relative; }
.rule i { position: absolute; inset: 0 auto 0 0; background: var(--glacier); transition: width .4s ease; }

/* HIN plate: the one memorable element */
.plate { display: inline-flex; flex-direction: column; border: 2px solid var(--glacier); border-radius: 8px; padding: 5px 12px 6px; background: rgba(140,199,214,.08); }
.plate small { font-size: 10.5px; letter-spacing: .1em; color: var(--glacier); font-weight: 600; }
.plate b { font: 600 clamp(22px, 6.5vw, 32px)/1.1 'Work Sans', sans-serif; letter-spacing: .14em; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 30px; padding: 13px 24px; font-weight: 600; font-size: 15.5px; min-height: 50px; text-decoration: none; background: var(--deep); color: #fff; border-bottom: 2px solid var(--glacier); }
.btn:active { transform: translateY(1px); }
.btn.glacier { background: var(--glacier); color: var(--deep-dark); border-bottom: 0; }
.btn.sec { background: #fff; color: var(--deep); border: 1.5px solid var(--stone-2); }
.btn.ghost { background: none; color: var(--deep); border: 0; padding: 8px 12px; min-height: 42px; text-decoration: underline; text-underline-offset: 3px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
label.f { display: block; margin: 0 0 14px; }
label.f span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.in-t { width: 100%; border: 1.5px solid var(--stone-2); border-radius: 10px; background: #fff; padding: 11px 13px; min-height: 48px; font-size: 16px; }
.in-t:focus { border-color: var(--deep); outline: none; box-shadow: 0 0 0 3px var(--glacier-tint); }
textarea.in-t { min-height: 84px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 440px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: #fff; border: 1px solid var(--stone-2); border-radius: 16px; padding: 18px; margin: 14px 0; }
.card h2 { font-size: 22px; color: var(--deep); margin-bottom: 12px; }
.banner { border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15px; background: var(--sun-tint); border-left: 4px solid var(--sun); }
.banner.info { background: var(--wash); border-left-color: var(--glacier); }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 30px; background: var(--stone); color: var(--muted); white-space: nowrap; }
.chip.prog { background: var(--glacier-tint); color: var(--deep); }
.chip.rev { background: var(--sun-tint); color: var(--sun-ink); }
.chip.done { background: var(--pine); color: #fff; }

/* login */
.login { min-height: 100vh; background: var(--grad); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 32px 22px; position: relative; overflow: hidden; }
.login .box { max-width: 380px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
.login svg.mark { width: 64px; height: 64px; }
.login h1 { font-size: 34px; margin: 14px 0 6px; }
.login p { color: #CFE6EC; margin: 0 0 22px; }
.login .in-t { font-size: 26px; letter-spacing: .4em; text-align: center; border: 0; color: var(--ink); background: #fff; caret-color: var(--deep); }
.login .err { color: #FFD9A8; min-height: 24px; margin: 10px 0 0; font-size: 15px; }
.login .etch { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; width: 100%; }

/* home */
.hero { padding: 24px 0 8px; }
.hero h2 { font-size: 30px; color: var(--deep); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
.filters button { border: 1.5px solid var(--stone-2); background: #fff; border-radius: 30px; padding: 8px 15px; white-space: nowrap; font-weight: 500; font-size: 14.5px; }
.filters button[aria-pressed="true"] { background: var(--deep); color: #fff; border-color: var(--deep); }
.jobs { display: grid; gap: 10px; }
@media (min-width: 820px) { .jobs { grid-template-columns: 1fr 1fr; } }
.jobrow { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--stone-2); border-left: 4px solid var(--glacier); border-radius: 14px; padding: 13px 14px; width: 100%; text-align: left; }
.jobrow[data-st="Complete"] { border-left-color: var(--pine); }
.jobrow[data-st="Awaiting Review"] { border-left-color: var(--sun); }
.jobrow .meta { flex: 1; min-width: 0; }
.jobrow .meta b { display: block; font: 500 18px 'Fraunces', Georgia, serif; color: var(--deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jobrow .hin { font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }

/* job header */
.jobhead { background: var(--grad); color: #fff; }
.jobhead .in { max-width: 900px; margin: 0 auto; padding: 4px 16px 16px; display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.jobhead .who { flex: 1; min-width: 170px; }
.jobhead .who b { display: block; font: 500 20px/1.2 'Fraunces', Georgia, serif; }
.jobhead .who span { color: #CFE6EC; font-size: 14px; }
.jobhead .chip.prog { background: var(--glacier); color: var(--deep-dark); }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--stone-2); z-index: 30; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: none; border: 0; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 500; color: var(--muted); position: relative; min-height: 58px; }
.tabs button svg { width: 23px; height: 23px; }
.tabs button[aria-selected="true"] { color: var(--deep); font-weight: 600; }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; background: var(--glacier); border-radius: 0 0 3px 3px; }
.tabs .badge { position: absolute; top: 4px; right: calc(50% - 24px); background: var(--sun); color: var(--deep-dark); font-weight: 600; border-radius: 30px; font-size: 11px; min-width: 19px; height: 19px; line-height: 19px; padding: 0 5px; }

/* checklist */
.sec { background: #fff; border: 1px solid var(--stone-2); border-radius: 16px; margin: 12px 0; overflow: hidden; }
.sec > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary h3 { flex: 1; font-size: 19px; color: var(--deep); }
.sec > summary .cnt { font-size: 14px; font-weight: 600; color: var(--muted); }
.sec[data-complete="1"] > summary .cnt { color: var(--pine); }
.sec[data-complete="1"] { border-top: 4px solid var(--pine); }
.sec .chev { transition: transform .2s; width: 18px; height: 18px; color: var(--glacier); flex: none; }
.sec[open] .chev { transform: rotate(90deg); }
.sec .secnote { padding: 0 16px 8px; font-size: 14px; color: var(--muted); }
.sec .secbar { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap; }
.item { border-top: 1px solid var(--stone-2); padding: 13px 16px; }
.item[data-s="done"] { background: var(--pine-tint); }
.item[data-s="na"] { background: var(--na-tint); }
.item[data-s="na"] .itxt { text-decoration: line-through; color: var(--muted); }
.item[data-s="flag"] { background: var(--sun-tint); }
.irow { display: flex; gap: 12px; align-items: flex-start; }
.tick { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--stone-2); background: #fff; display: grid; place-items: center; padding: 0; color: var(--muted); }
.tick svg { width: 21px; height: 21px; }
.tick.box svg { opacity: 0; }
.item[data-s="done"] .tick.box { background: var(--pine); border-color: var(--pine); color: #fff; }
.item[data-s="done"] .tick.box svg { opacity: 1; }
.item[data-s="flag"] .tick.box { background: var(--sun); border-color: var(--sun); color: var(--deep-dark); }
.item[data-s="flag"] .tick.box svg { opacity: 1; }
.tick.more { border: 0; background: none; }
.itxt { flex: 1; padding-top: 6px; }
.itxt .req { display: inline-block; margin-left: 6px; font-size: 12.5px; font-weight: 600; color: var(--sun-ink); white-space: nowrap; }
.itxt .req.ok { color: var(--pine); }
.itxt .hint { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.iact { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0 50px; }
.iact button, .iact label { border: 1.5px solid var(--stone-2); background: #fff; border-radius: 30px; padding: 7px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer; }
.iact .cam { border-color: var(--deep); color: var(--deep); }
.iact .cam.need { border-color: var(--sun); background: var(--sun-tint); color: var(--sun-ink); }
.iact svg { width: 18px; height: 18px; }
.ival { margin: 10px 0 0 50px; display: flex; gap: 10px; flex-wrap: wrap; }
.ival label { flex: 1 1 150px; min-width: 0; }
.ival span { font-size: 13px; color: var(--muted); display: block; margin-bottom: 3px; }
.ival .in-t { min-height: 44px; padding: 8px 11px; max-width: 100%; min-width: 0; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0 0 50px; }
.thumbs .th { position: relative; flex: none; }
.thumbs img { width: 78px; height: 78px; object-fit: cover; border-radius: 10px; border: 1px solid var(--stone-2); }
.th.pending img { opacity: .55; }
.th.pending::after { content: "Uploading"; position: absolute; left: 4px; right: 4px; bottom: 4px; font-size: 10.5px; text-align: center; background: rgba(12,57,68,.8); color: #fff; border-radius: 6px; padding: 1px 0; }
.flagnote { margin: 10px 0 0 50px; }
@media (min-width: 820px) { .ival label { flex-basis: 220px; } }

/* photos tab */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (min-width: 820px) { .pgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
.pgrid figure { margin: 0; background: #fff; border: 1px solid var(--stone-2); border-radius: 12px; overflow: hidden; }
.pgrid img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--stone); }
.pgrid figcaption { padding: 6px 9px; font-size: 13px; }
.pgrid figcaption input { width: 100%; border: 0; background: none; padding: 2px 0; font-size: 14px; }
.pgrid .pbar { display: flex; justify-content: space-between; align-items: center; padding: 0 9px 7px; font-size: 12px; color: var(--muted); }
.pgrid .pbar button { background: none; border: 0; color: var(--danger); font-size: 13px; padding: 4px; }
.cp { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--stone-2); }
.cp:first-of-type { border-top: 0; }
.cp .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sun); flex: none; }
.cp .dot.ok { background: var(--pine); }
.cp .t { flex: 1; }

/* parts */
.tblwrap { overflow-x: auto; }
table.parts { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 440px; }
table.parts th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--stone-2); }
table.parts td { padding: 6px 4px; border-bottom: 1px solid var(--stone-2); vertical-align: top; }
table.parts input { width: 100%; border: 1.5px solid var(--stone-2); border-radius: 8px; background: #fff; padding: 8px 9px; min-height: 42px; font-size: 16px; }
table.parts td.q { width: 76px; }
table.parts td.x { width: 38px; }
table.parts button.del { background: none; border: 0; color: var(--danger); font-size: 22px; line-height: 1; padding: 8px; }
.rec { border: 1px solid var(--stone-2); border-left: 4px solid var(--sun); border-radius: 12px; padding: 12px; margin: 10px 0; background: var(--wash); }
.rec .top2 { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.rec select { border: 1.5px solid var(--stone-2); border-radius: 8px; background: #fff; padding: 8px 10px; font-size: 15px; }

.res { display: block; width: 100%; text-align: left; background: var(--wash); border: 1px solid var(--stone-2); border-radius: 12px; padding: 11px 13px; margin: 8px 0; }
.res b { display: block; color: var(--deep); }
.res span { font-size: 14px; color: var(--muted); }

.sig { border: 1.5px dashed var(--glacier); border-radius: 12px; background: var(--wash); touch-action: none; width: 100%; height: 160px; display: block; }
.sigimg { border: 1px solid var(--stone-2); border-radius: 12px; background: #fff; max-height: 120px; }

.sheet { position: fixed; inset: 0; background: rgba(12,57,68,.55); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: #fff; border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 520px; }
.sheet h2 { font-size: 22px; color: var(--deep); margin-bottom: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--deep-dark); color: #fff; padding: 11px 18px; border-radius: 30px; font-size: 15px; z-index: 70; max-width: 92vw; text-align: center; box-shadow: 0 8px 26px rgba(12,57,68,.3); }
.list-plain { margin: 0; padding-left: 20px; }
.list-plain li { margin: 4px 0; }
.check { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--deep); flex: none; }
.th .del-ph { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--deep-dark); color: #fff; font-size: 16px; line-height: 24px; padding: 0; cursor: pointer; }
.res[disabled] { opacity: .55; cursor: not-allowed; }
.apps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* boats board + check-in tab */
.startbtns { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .startbtns { grid-template-columns: 1fr 1fr; } }
.jobrow { padding: 0; gap: 0; align-items: stretch; }
.jobrow .jobmain { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; background: none; border: 0; padding: 13px 8px 13px 14px; text-align: left; color: inherit; font: inherit; cursor: pointer; border-radius: 12px 0 0 12px; }
.jobrow .jobdel { flex: none; width: 48px; background: none; border: 0; border-left: 1px solid var(--stone); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0 12px 12px 0; }
.jobrow .jobdel svg { width: 20px; height: 20px; }
.jobrow .jobdel:hover, .jobrow .jobdel:focus-visible { color: var(--danger); background: #FBEDEB; }
.jobrow[data-stage="Checking in"], .jobrow[data-stage="Awaiting signature"] { border-left-color: var(--sun); }
.jobrow[data-stage="Check-in complete"] { border-left-color: var(--deep); }
.jobrow[data-stage="Needs review"] { border-left-color: var(--sun); }
.jobrow[data-stage="Complete"] { border-left-color: var(--pine); }
.ckicon { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--sun-tint); color: var(--sun-ink); display: flex; align-items: center; justify-content: center; }
.jobrow[data-stage="Check-in complete"] .ckicon { background: var(--glacier-tint); color: var(--deep); }
.ckicon svg { width: 24px; height: 24px; }
.chip.ckin { background: var(--sun-tint); color: var(--sun-ink); }
.chip.ready { background: var(--deep); color: #fff; }
.jobhead .chip.ckin { background: var(--sun); color: var(--deep-dark); }
.jobhead .chip.ready { background: #fff; color: var(--deep); }
.btn.danger { background: var(--danger); color: #fff; border-bottom: 0; }
.btn[disabled] { opacity: .5; }
.sheet .panel.modal { border-radius: 20px; margin: auto 16px; align-self: center; max-width: 460px; }
.modal .check { background: var(--wash); border-radius: 12px; padding: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 150px; }
.jobrow .when { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.jobrow .jobmain, .jobrow .meta { overflow: hidden; }
.jobs { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .jobs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.jobs > .jobrow { min-width: 0; }
.jobrow .hin { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jobrow .meta .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jobrow .chip { flex: none; }
.tabs.six .in { grid-template-columns: repeat(6, 1fr); }
.tabs.six button { font-size: 11.5px; }
.tabs button.locked { opacity: .45; }

/* packages + visit */
.pkgs { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .pkgs { grid-template-columns: repeat(3, 1fr); } }
.pkg { text-align: left; border: 1.5px solid var(--stone-2); background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit; color: var(--ink); display: grid; gap: 2px; }
.pkg b { font-size: 15px; } .pkg span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.pkg[aria-pressed="true"] { border-color: var(--deep); background: var(--deep); color: #fff; }
.pkg[aria-pressed="true"] span { color: #d7ecf1; }
.vboats { display: grid; gap: 8px; margin-bottom: 12px; }
.vboat { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1.5px solid var(--stone-2); background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit; color: var(--ink); }
.vboat > span { display: grid; min-width: 0; } .vboat b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

class ApiError extends Error { constructor(m, status, offline) { super(m); this.status = status; this.offline = offline; } }
async function api(action, payload = {}) {
  let res;
  try {
    res = await fetch("/api/winterize", { method: "POST", headers: { "Content-Type": "application/json", "x-tech-pin": lsGet("wl_pin") || "" }, body: JSON.stringify({ action, ...payload }) });
  } catch (e) { throw new ApiError("No connection", 0, true); }
  let d; try { d = await res.json(); } catch (e) { d = { ok: false, error: "Unexpected response from the server (" + res.status + ")" }; }
  if (res.status === 401 && action !== "login") { signOut("Your PIN was changed or removed. Sign in again."); throw new ApiError("Signed out", 401); }
  if (!d.ok) throw new ApiError(d.error || "Request failed", res.status);
  return d;
}
function signOut(msg) { lsDel("wl_pin"); lsDel("wl_tech"); S.tech = ""; S.view = "login"; S.job = null; S.ck = null; S.loginErr = msg || ""; render(); }

/* ============================================================
   HIN
   ============================================================ */
function normHin(h) { return String(h || "").toUpperCase().replace(/^US[-\s]?/, "").replace(/[^A-Z0-9]/g, ""); }
function parseHin(h) {
  h = normHin(h);
  if (h.length !== 12) return { ok: false, hin: h, msg: h.length ? `${h.length} of 12 characters. US HINs are 12 characters.` : "" };
  const ok = /^[A-Z0-9]{3}[A-Z0-9]{5}[A-L][0-9][0-9]{2}$/.test(h);
  const my = parseInt(h.slice(10), 10); const year = my > 50 ? 1900 + my : 2000 + my;
  return { ok, hin: h, year, msg: ok ? `Maker code ${h.slice(0, 3)}, model year ${year}` : "This doesn't match the standard HIN pattern. Double-check the plate." };
}

    .filter(s => s.items.length);
}
function liveItems(job) { const out = []; sectionsFor(job).forEach(s => { if (s.equip && job.notEquipped && job.notEquipped[s.id]) return; s.items.forEach(i => out.push({ ...i, sec: s.id, secTitle: s.title })); }); return out; }

const IDB = (() => {

})();

}

      step: it ? it.t : rec ? (rec.text || "Recommendation") : "General", caption: it ? it.t.split(";")[0] : rec ? "Recommendation" : "General", at: Date.now(), blob };

    for (const p of [...S.pendingPhotos]) {

        const r = await api("uploadPhoto", { ...(p.checkinId ? { checkinId: p.checkinId } : { jobId: p.jobId }), hin: p.hin, item: p.item, sec: p.sec, step: p.step, caption: p.caption, at: p.at, uploadId: p.qid, contentType: "image/jpeg", data: await blobToB64(p.blob) });

}

// Start a check-in for a HIN. From an open job with no check-in, the new

async function startCheckin(hinIn, fromJob) {
  const hin = normHin(hinIn); if (hin.length < 5) { toast("Enter the HIN first."); return; }
  S.busy = true; render();
  let pre;
  try { pre = await api("checkinPrefill", { hin }); }
  catch (e) { S.busy = false; render(); toast(e.offline ? "You need signal to start a check-in." : "Couldn't look up the boat: " + e.message, 4500); return; }
  const existing = pre.openCheckin || (pre.lastCheckin && fromJob ? pre.lastCheckin : null);
  if (existing) {
    S.busy = false;
    if (fromJob && S.job) { save({ checkinId: existing.id }); clearTimeout(saveTimer); await flush(); openWorkspace({ jobId: S.job.id }, "checkin"); toast("Linked this boat's existing check-in"); return; }
    toast("This boat already has an open check-in. Opening it."); openWorkspace({ checkinId: existing.id }, "checkin"); return;
  }
  if (pre.lastCheckin && ["Signed", "Override"].includes(pre.lastCheckin.status) && !confirm(`This boat was already checked in this season (${fmtTime(Date.parse(pre.lastCheckin.at))}). Start another check-in?`)) { S.busy = false; openWorkspace({ checkinId: pre.lastCheckin.id }, "checkin"); return; }
  const j = fromJob ? S.job : null;
  const cust = pre.customer ? pickCust(pre.customer) : j && j.customer && j.customer.id ? pickCust(j.customer) : null;
  const boat = pre.boat ? pickBoat(pre.boat) : j && j.boat && j.boat.id ? { id: j.boat.id, name: j.boat.name, mmc: j.makeModel, length: j.length, year: j.year, hin, type: j.boat.type, drive: j.boat.drive } : null;
  const c = { hin, season: pre.season, checkedInAt: Date.now(), checkedInBy: S.tech, customer: cust, boat, package: pre.packageGuess || "", where: "", fuel: "", engineHours: j && j.engineHours || "", noDamage: false, damage: "", items: "", keys: "", notes: "" };
  let reused = false;
  try { const r = await api("createCheckin", { state: c, summary: { title: `${pre.season.slice(0, 4)} Check-in - ${(cust && cust.name) || "No customer"} - ${boatLabel(boat) || hin}`, photoCount: 0 } }); c.id = r.id; reused = !!r.existing; }
  catch (e) { S.busy = false; render(); toast("Couldn't start the check-in: " + e.message, 4500); return; }
  S.busy = false; S.newHin = "";
  if (j) { save({ checkinId: c.id }); clearTimeout(saveTimer); await flush(); openWorkspace({ jobId: j.id }, "checkin"); }
  else openWorkspace({ checkinId: c.id }, "checkin");
  toast(reused ? "This boat already has an open check-in. Opened it." : cust ? `Found in Airtable: ${cust.name}` : "New boat: link the customer on the Check-in tab", 3500);
}

const bpMoney = n => n;
function bpPlanFor(b) {
  const isPontoon = /pontoon|tritoon/i.test([b.type, b.name, b.mmc].join(" "));
  const type = { "Inboard, V-drive": "VD", "Inboard, direct drive": "DD", "Sterndrive (I/O)": "IO", "Outboard": isPontoon ? "PT" : "OB", "Jet (PWC)": "PWC" }[b.driveType] || "";
  let profile = "";
  if (b.engineMake === "PCM") profile = /210/.test([b.engineModel, b.mmc, b.name].join(" ")) ? "SAN 210" : "GS 20";
  else if (b.engineMake === "Indmar") profile = "NXT20";
  else if (type === "PT" || type === "OB") profile = Number(b.hp) >= 200 ? "Outboard - 200hp +" : "Outboard - Standard";
  else if (type === "PWC") profile = b.engineMake === "Rotax (Sea-Doo)" ? "PWC - Rotax" : "PWC - Standard";
  return { type, profile: PROFILES[profile] ? profile : "" };
}

// Parts and fluids the boat takes: [label, value, internalOnly]
function bpParts(b, ck) {
  const plan = bpPlanFor(b); const P = PROFILES[plan.profile] || {}; const t = plan.type; const rows = [];

  if (P.kind === "inboard") { oil = /Indmar|Ford/i.test(b.engineMake) ? P.oilFord : (P.oilGM || P.oilFord); qt = "about 7 qt"; }
  else if (P.oil) { oil = P.oil; qt = t === "PWC" ? "about 4 qt" : "about 5.5 qt"; }
  else if (t === "IO") { oil = b.engineMake === "Volvo Penta" ? "Volvo Penta 15W-40 (confirm)" : "Marine 25W-40"; qt = "about 6 qt"; }
  if (oil) rows.push(["Engine oil", `${oil}, ${qt}`]);

}

function bpPdf(all, customer) {

    const row = (k, v) => { const lines = doc.splitTextToSize(strip(v), W - M * 2 - 150); if (y + lines.length * 13 > 740) { doc.addPage(); y = 50; } doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUT); doc.text(strip(k), M + 10, y); doc.setTextColor(...INK); doc.text(lines, M + 160, y); y += lines.length * 13 + 3; };
    const para = t => { const lines = doc.splitTextToSize(strip(t), W - M * 2 - 10); if (y + lines.length * 13 > 740) { doc.addPage(); y = 50; } doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(lines, M + 10, y); y += lines.length * 13 + 3; };
    head("Engine and drive");

    y += 8; head("Condition history");
    (b.checkins || []).forEach(c => { row(`${(c.season || "").slice(0, 4)} check-in`, [c.at ? fmtDate(String(c.at).slice(0, 10)) : "", c.where, c.fuel && "Fuel " + c.fuel, c.hours && c.hours !== "N/A" ? c.hours + " hrs" : "", c.damage, c.items && "Aboard: " + c.items].filter(Boolean).join(". ")); });
    if (!(b.checkins || []).length) para("No check-ins yet.");

    (b.jobs || []).filter(j => !customer || j.status === "Complete").forEach(j => row(`Winterization ${(j.dateIn || "").slice(0, 4)}`, (j.status === "Awaiting Review" ? "Needs review" : j.status) + (j.dateDone ? ", finished " + fmtDate(j.dateDone) : "")));

    y += 8; head("Recommendations");
    const recs = bpRecs(b, customer);

    if (spJob) { y += 8; head("For spring launch"); spJob.spring.split("\n").filter(Boolean).forEach(t => para("\u2022  " + t)); }

    doc.setPage(pages); doc.setFillColor(...DARK); doc.rect(0, 762, W, 30, "F");
    doc.setFontSize(9); doc.setTextColor(205, 230, 236); doc.text("Waterline Lake Services  \u00b7  Columbus, IN", M, 780); doc.text("(317) 258-8269", W - M, 780, { align: "right" });
  });

  const name = `${slug(last)}-${all ? "boats" : slug(bpTitle(list[0]))}-${customer ? "customer" : "internal"}.pdf`;
  doc.save(name);
  toast("Saved " + name);
}

    ${ready ? `<div style="display:grid;gap:10px;margin-top:14px"><button class="btn" data-a="sharepdf">${navigator.canShare && lastPdf && navigator.canShare({ files: [lastPdf] }) ? "Share or save PDF" : "Open PDF"}</button><button class="btn sec" data-a="closesheet">Done</button></div>` : ""}</div></div>`;
}
async function sharePdf() {
  if (!lastPdf) return;
  if (navigator.canShare && navigator.canShare({ files: [lastPdf] })) { try { await navigator.share({ files: [lastPdf], title: lastPdf.name }); } catch (e) {} return; }
  const url = URL.createObjectURL(lastPdf); const a = document.createElement("a"); a.href = url; a.download = lastPdf.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function buildPdf(j, mode) {
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "pt", format: "letter" });
  const W = 612, H = 792, M = 42; let y = 0;
  const DEEP = [19, 78, 94], DEEPD = [12, 57, 68], PINE = [47, 93, 80], GLACIER = [140, 199, 214], SUN = [231, 162, 76], INK = [22, 35, 43], MUTED = [106, 116, 128], LINE = [220, 227, 230];
  const draft = j.status !== "complete";
  const footer = () => { doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(pdfTxt(`Waterline Lake Services LLC  |  (317) 258-8269  |  service@waterlinelakeservices.com  |  HIN ${j.hin || "-"}${draft ? "  |  DRAFT" : ""}`), M, H - 22); };
  const page = () => { doc.addPage(); y = M; footer(); };
  const need = h => { if (y + h > H - 44) page(); };
  const h2 = t => { need(40); y += 10; doc.setFont("times", "normal"); doc.setFontSize(15); doc.setTextColor(...DEEP); doc.text(pdfTxt(t), M, y); y += 7; doc.setDrawColor(...GLACIER); doc.setLineWidth(2); doc.line(M, y, M + 34, y); y += 15; };
  const para = (t, o = {}) => { doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 10); doc.setTextColor(...(o.color || INK)); doc.splitTextToSize(pdfTxt(t), W - 2 * M).forEach(l => { need(14); doc.text(l, M, y); y += 13; }); };
  const bullet = (t, mark, color) => { doc.setFont("helvetica", "normal"); doc.setFontSize(10); const lines = doc.splitTextToSize(pdfTxt(t), W - 2 * M - 18); need(lines.length * 13);
    doc.setTextColor(...(color || PINE)); doc.setFont("helvetica", "bold"); doc.text(mark || "-", M, y); doc.setFont("helvetica", "normal"); doc.setTextColor(...INK); lines.forEach(l => { doc.text(l, M + 18, y); y += 13; }); };

  // header band in brand gradient colors
  doc.setFillColor(...DEEP); doc.rect(0, 0, W, 104, "F"); doc.setFillColor(...DEEPD); doc.rect(0, 70, W, 34, "F");
  doc.setDrawColor(...GLACIER); doc.setLineWidth(1.6); doc.circle(M + 16, 40, 13, "S"); doc.setDrawColor(...GLACIER); doc.line(M - 2, 40, M + 34, 40); doc.setFillColor(...GLACIER); doc.circle(M + 16, 40, 2, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("times", "normal"); doc.setFontSize(22); doc.text("Waterline", M + 42, 47);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text(mode === "full" ? "Winterization work order" : "Winterization service report", M, 91);
  doc.setTextColor(...GLACIER); doc.text(pdfTxt(draft ? "DRAFT: job not yet complete" : "Completed " + fmtDate(j.dateCompleted)), W - M, 91, { align: "right" });
  doc.setDrawColor(...GLACIER); doc.roundedRect(W - M - 180, 20, 180, 42, 5, 5, "S"); doc.setFontSize(7.5); doc.text("HULL ID", W - M - 170, 33);
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text(pdfTxt(j.hin || "-"), W - M - 170, 54);
  y = 132; footer();

  const c = j.customer || {}; const so = j.signoff || {};
  const facts = [["Customer", c.name], ["Phone / email", [c.phone, c.email].filter(Boolean).join("  /  ")], ["Boat", [j.year, j.makeModel].filter(Boolean).join(" ") || (j.boat && j.boat.name)],
    ["Service type", TYPES[j.type] && TYPES[j.type].label + (j.cooling ? (j.cooling === "raw" ? ", raw-water cooled" : ", closed cooled") : "")], ["Engine", j.engine],
    ["Engine hours", j.engineHours], ["Checked in", j.checkin ? [fmtDate(Date.parse(j.checkin.at)), j.checkin.by].filter(Boolean).join(" by ") : ""], ["Technician", so.techName || j.technician], ["Date in / completed", [fmtDate(j.dateIn), fmtDate(j.dateCompleted)].filter(Boolean).join("  /  ")],
    ["Signed agreement", j.agreementRef ? j.agreementRef + (j.agreementAt ? ", " + fmtDate(Date.parse(j.agreementAt)) : "") : ""]];
  const colW = (W - 2 * M) / 2;
  facts.forEach((f, i) => { const x = M + (i % 2) * colW; if (i % 2 === 0 && i) y += 27; need(27);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(pdfTxt(f[0]), x, y);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(doc.splitTextToSize(pdfTxt(f[1] || "-"), colW - 12)[0], x, y + 13); });
  y += 36;

  const rd = [["Battery voltage", j.batteryVoltage && j.batteryVoltage + " V"], ["Coolant freeze point", j.coolantF && j.coolantF + " \u00b0F"], ["Antifreeze used", j.antifreezeGal && j.antifreezeGal + " gal"],
    ["Fuel added", j.checks && j.checks.fu_top && j.checks.fu_top.v && j.checks.fu_top.v.gal && j.checks.fu_top.v.gal + " gal"], ["Impeller", impellerOf(j)]].filter(r => r[1]);
  const lube = ["od_lube", "lu_lube"].find(id => j.checks && j.checks[id] && j.checks[id].v && j.checks[id].v.cond); if (lube) rd.push(["Gear lube", j.checks[lube].v.cond]);
  if (rd.length) { h2("Readings"); rd.forEach(r => bullet(r[0] + ": " + r[1], "\u2022", DEEP)); }

  h2(mode === "full" ? "Checklist" : "Work performed");
  sectionsFor(j).forEach(s => {
    const na = s.equip && j.notEquipped && j.notEquipped[s.id];
    const rows = mode === "full" ? s.items : s.items.filter(i => st(j, i.id) === "done");
    if (na) { if (mode === "full") { need(30); para(s.title, { bold: true, size: 10.5, color: DEEP }); para("Not equipped", { color: MUTED }); y += 4; } return; }
    if (!rows.length) return; need(30); para(s.title, { bold: true, size: 10.5, color: DEEP }); y += 1;
    rows.forEach(i => { const ck = (j.checks && j.checks[i.id]) || {};
      const vals = i.inputs ? i.inputs.map(inp => ck.v && ck.v[inp.k] ? inp.label + ": " + ck.v[inp.k] : "").filter(Boolean).join("; ") : "";
      let t = i.t + (vals ? "  (" + vals + ")" : "");
      if (mode === "full") { const mk = ck.s === "done" ? "[x]" : ck.s === "na" ? "[NA]" : ck.s === "flag" ? "[!]" : "[ ]"; if (ck.s === "flag" && ck.note) t += "  Note: " + ck.note; if (ck.by) t += "  - " + ck.by; bullet(t, mk, ck.s === "flag" ? SUN : ck.s ? PINE : MUTED); }
      else bullet(t, "\u2713", PINE); });
    y += 4;
  });
  if (mode === "full" && j.overrideNote) { h2("Submitted with open items"); para(j.overrideNote); }
  if (mode === "full" && j.checkinOverride) { h2("Started without a signed check-in"); para(j.checkinOverride); }
  const parts = (j.parts || []).filter(p => p.name && (mode === "full" || p.qty));
  if (parts.length) { h2("Parts and fluids used"); parts.forEach(p => bullet(p.name + (p.qty ? "  |  Qty " + p.qty : "") + (p.part ? "  |  Part # " + p.part : ""), "\u2022", DEEP)); }
  const recs = recList(j);
  h2("Recommended before spring");
  if (recs.length) recs.forEach(r => bullet(r.pri + ": " + r.text, "!", SUN)); else para("Nothing found that needs repair.", { color: MUTED });
  const sp = springList(j); if (sp.length) { h2("At spring launch, we will"); sp.forEach(t => bullet(t, "\u2022", DEEP)); }
  if (j.removed) { h2("Items removed or stored"); para(j.removed); }

  let ph = [...S.photos, ...S.pendingPhotos.filter(p => p.jobId === j.id)].sort((a, b) => a.at - b.at);
  if (mode === "customer") { const recIds = new Set((j.recs || []).map(r => r.id)); ph = ph.filter(p => { const it = liveItems(j).find(i => i.id === p.item); return !p.item || recIds.has(p.item) || (it && (it.photo === "req" || st(j, it.id) === "flag")); }).slice(0, 24); }
  if (ph.length) {
    page(); h2("Photos"); const gw = (W - 2 * M - 14) / 2; let col = 0, rowH = 0;
    for (const p of ph) {
      let im; try { im = await photoForPdf(p); } catch (e) { continue; }
      const hgt = Math.min(gw * im.h / im.w, 220); const wid = hgt * im.w / im.h;
      if (col === 0) need(hgt + 34); const x = M + col * (gw + 14);
      doc.addImage(im.url, "JPEG", x, y, wid, hgt);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...INK); doc.text(doc.splitTextToSize(pdfTxt(p.cap || p.caption || ""), gw)[0] || "", x, y + hgt + 11);
      doc.setTextColor(...MUTED); doc.text(pdfTxt(fmtTime(p.at)), x, y + hgt + 22);
      rowH = Math.max(rowH, hgt + 30); if (col === 1) { y += rowH; rowH = 0; col = 0; } else col = 1;
    }
    if (col === 1) y += rowH;
  }
  h2("Sign-off"); need(84); const sy = y;
  [["Technician", so.techName, so.techSigData, so.techAt], ["Reviewed by", so.revName, so.revSigData, so.revAt]].forEach(([lab, nm, data, at], k) => {
    const x = M + k * colW;
    if (data) { try { doc.addImage(data, "PNG", x, sy, 150, 48); } catch (e) {} }
    doc.setDrawColor(...LINE); doc.line(x, sy + 54, x + colW - 24, sy + 54);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(pdfTxt(nm || "-"), x, sy + 67);
    doc.setFont("helvetica", "normal"); doc.setTextColor(...MUTED); doc.text(pdfTxt(lab + (at ? "  |  " + new Date(at).toLocaleDateString("en-US") : "")), x, sy + 79);
  });
  y = sy + 96;
  if (mode === "customer") para("Questions about your boat? Call or text us at (317) 258-8269, or email service@waterlinelakeservices.com. Thanks for trusting us with your boat this winter.", { color: MUTED, size: 9.5 });
  return doc.output("blob");
}

function afterLogin() {
  const q = new URLSearchParams(location.search);
  drainPhotoQueue();
  if (q.get("boat")) { loadProfile(q.get("boat")); return; }
  if (q.get("job") || q.get("checkin")) { openWorkspace({ jobId: q.get("job"), checkinId: q.get("checkin") }, q.get("tab") || undefined); return; }
  S.view = "home"; render(); loadBoard();
  if (q.get("hin")) { S.newHin = q.get("hin"); S.newMode = q.get("new") === "job" ? "job" : "ck"; S.view = "new"; render(); }
}
(function start() {
  S.tech = lsGet("wl_tech") || "";
  if (lsGet("wl_pin") && S.tech) afterLogin(); else render();
})();
