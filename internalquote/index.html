<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waterline — Internal Quote Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --deep: #134E5E;
    --deep-dark: #0C3944;
    --pine: #2F5D50;
    --glacier: #8CC7D6;
    --glacier-tint: rgba(140,199,214,0.18);
    --stone: #E8ECEF;
    --stone-2: #DCE3E6;
    --white: #FFFFFF;
    --ink: #16232B;
    --muted: #6A7480;
    --ok: #2F5D50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--stone); color: var(--ink);
    font-family: 'Work Sans', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .voice { font-family: 'Fraunces', serif; }
  header {
    background: var(--deep); color: #fff; padding: 22px 28px;
  }
  header .brand { display: flex; align-items: baseline; gap: 10px; }
  header .brand .name { font-family: 'Fraunces', serif; font-size: 22px; }
  header .brand .tag { font-size: 12px; color: var(--glacier); letter-spacing: 0.06em; }
  header .note { font-size: 12px; color: #B9D6DC; margin-top: 6px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 22px; }
  @media (max-width: 880px) { .wrap { grid-template-columns: 1fr; } }

  .card {
    background: #fff; border: 1px solid var(--stone-2); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 18px;
  }
  .card h2 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; color: var(--deep);
    margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--stone-2);
  }
  .field-label { font-size: 12.5px; font-weight: 600; color: var(--pine); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .btn-opt {
    flex: 1; min-width: 100px; text-align: center; padding: 10px 8px; border-radius: 10px;
    border: 1.5px solid var(--stone-2); cursor: pointer; font-size: 13.5px; font-weight: 500;
    background: #fff; color: var(--ink); user-select: none; transition: all .1s;
  }
  .btn-opt.active { background: var(--deep); border-color: var(--deep); color: #fff; }
  .btn-opt .sub { display: block; font-size: 11px; opacity: 0.75; margin-top: 2px; font-weight: 400; }

  .row { display: flex; gap: 14px; align-items: flex-end; margin-bottom: 4px; }
  .num-field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .num-field label { font-size: 12.5px; color: var(--muted); }
  .num-field input[type="number"], .num-field input[type="text"], .num-field input[type="date"] {
    font-family: 'Work Sans', sans-serif; font-size: 15px; padding: 10px 12px;
    border: 1.5px solid var(--stone-2); border-radius: 8px; background: var(--white); color: var(--ink); width: 100%;
  }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .addon-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--stone-2);
  }
  .addon-row:first-child { border-top: none; }
  .addon-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--deep); flex: none; }
  .addon-row .a-label { flex: 1; font-size: 14px; }
  .addon-row .a-label b { color: var(--deep); }
  .addon-row .a-note { font-size: 11.5px; color: var(--muted); display: block; }
  .addon-row .a-price { font-family: 'Fraunces', serif; font-weight: 500; color: var(--deep); font-size: 14.5px; white-space: nowrap; }
  .addon-row .a-price input { width: 68px; font-size: 13.5px; padding: 5px 6px; border: 1px solid var(--stone-2); border-radius: 6px; text-align: right; }
  .addon-row.disabled { opacity: 0.55; }
  .free-chip {
    display: inline-block; background: var(--glacier-tint); color: var(--pine); font-size: 10.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; margin-left: 6px;
  }

  .override-check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .override-check input { width: 18px; height: 18px; accent-color: var(--deep); flex: none; }

  /* BOAT CARDS */
  .boat-card { position: relative; border: 1.5px solid var(--stone-2); }
  .boat-card-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--stone-2); }
  .boat-card-head h2 { margin: 0; padding: 0; border: none; }
  .remove-boat-btn {
    background: transparent; border: 1.5px solid var(--stone-2); color: var(--muted); font-size: 12px;
    padding: 6px 12px; border-radius: 20px; cursor: pointer; font-family: 'Work Sans', sans-serif;
  }
  .remove-boat-btn:hover { border-color: #D98366; color: #B4472C; }
  .add-boat-btn {
    width: 100%; background: #fff; border: 1.5px dashed var(--glacier); color: var(--deep);
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 13px; border-radius: 12px;
    cursor: pointer; margin-bottom: 18px;
  }
  .add-boat-btn:hover { background: var(--glacier-tint); }

  .boat-mini-summary { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--stone-2); }
  .boat-mini-summary .s-line { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--muted); }
  .boat-mini-summary .s-line b { color: var(--ink); font-weight: 500; }
  .boat-mini-summary .s-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--stone-2); }
  .boat-mini-summary .s-total .label { font-size: 12px; color: var(--pine); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .boat-mini-summary .s-total .amt { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; color: var(--deep); }

  .savings-box {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.5;
    background: var(--glacier-tint); color: var(--pine); display: none;
  }
  .savings-box.show { display: block; }
  .savings-box b { color: var(--deep); }
  .savings-box.negative { background: #FCEFEA; color: #8A3E22; }
  .savings-box.negative b { color: #8A3E22; }

  /* SUMMARY */
  .summary { position: sticky; top: 20px; }
  .summary-card { background: var(--deep); color: #fff; border-radius: 14px; padding: 24px; }
  .summary-card h2 { color: #fff; border-bottom-color: rgba(255,255,255,0.18); }
  .s-line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; color: #D7E7EC; }
  .s-line b { color: #fff; font-weight: 500; }
  .s-div { border-top: 1px solid rgba(255,255,255,0.18); margin: 8px 0; }
  .s-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .s-total .label { font-size: 13px; color: var(--glacier); text-transform: uppercase; letter-spacing: 0.06em; }
  .s-total .amt { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 500; }
  .copy-btn {
    margin-top: 16px; width: 100%; background: var(--glacier); color: var(--deep-dark); border: none;
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 12px; border-radius: 30px; cursor: pointer;
  }
  .copy-btn:active { opacity: 0.85; }
  .copy-status { font-size: 11.5px; color: var(--glacier); text-align: center; margin-top: 8px; min-height: 14px; }
  .save-btn {
    margin-top: 10px; background: transparent; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.55);
  }
  .save-btn:active { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.6; cursor: default; }

  .warn { background: #FCEFEA; border: 1px solid #F0C9BA; color: #8A3E22; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; margin-top: 10px; display: none; }
  .warn.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="name">Waterline</span><span class="tag">INTERNAL QUOTE TOOL</span></div>
</header>

<div class="wrap">
  <div class="main">

    <div class="card">
      <h2>Customer</h2>
      <div id="loadedBanner" style="display:none; margin:-4px 0 16px; padding:9px 12px; border-radius:8px; font-size:12.5px; background:var(--glacier-tint); color:var(--pine); font-weight:500;"></div>
      <div class="row" style="margin-bottom:14px;">
        <div class="num-field"><label>Customer name</label><input type="text" id="custName" placeholder="—"></div>
        <div class="num-field"><label>Phone</label><input type="text" id="custPhone" placeholder="—"></div>
      </div>
      <div class="row" style="margin-bottom:14px;">
        <div class="num-field"><label>Email</label><input type="text" id="custEmail" placeholder="—"></div>
        <div class="num-field"><label>Address</label><input type="text" id="custAddress" placeholder="Street, city"></div>
      </div>
      <div class="row">
        <div class="num-field"><label>Date</label><input type="text" id="quoteDate" placeholder="—"></div>
        <div class="num-field"><label>Staff</label><input type="text" id="staffName" placeholder="—"></div>
      </div>
      <p class="hint">This customer's info is shared across every boat below — one Customer record, however many boats they store with us.</p>
    </div>

    <div id="boatCardsContainer"></div>

    <button type="button" class="add-boat-btn" id="addBoatBtn">+ Add another boat</button>

  </div>

  <div class="summary">
    <div class="summary-card">
      <h2>Quote summary</h2>
      <div id="grandLines"></div>
      <div class="s-div"></div>
      <div class="s-total"><span class="label">Grand total</span><span class="amt" id="grandTotal">$0</span></div>

      <button class="copy-btn" id="copyBtn">Copy quote summary</button>
      <button class="copy-btn save-btn" id="saveBtn">Save to CRM &amp; download PDF</button>
      <p class="copy-status" id="copyStatus"></p>
      <p class="copy-status" id="saveStatus"></p>
      <div id="quoteLinksBox" style="display:none; margin-top:10px; padding:10px 12px; background:rgba(255,255,255,0.08); border-radius:8px;">
        <p style="font-size:11.5px; color:#C7DEE5; margin:0 0 6px;">Live quote links — send these to the customer so they can review &amp; accept online:</p>
        <div id="quoteLinksList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- PRICING MODEL ----
  // Per the updated Waterline Lake Services Pricing Model (Aug '26 revision):
  // Harbor Ski/Inboard raised, Flagship lowered on both categories (Flagship
  // was pricing above Harbor + add-ons, which didn't make sense), and a new
  // Jet Ski / PWC category added. Anchor stays flat-rate regardless of
  // length for ALL categories (boats and PWCs alike) since it's mobile
  // service at the customer's own storage — Waterline isn't pricing a
  // storage footprint, so there's nothing to charge more for on a longer
  // unit. (Note: the source spreadsheet's Full Rate Card computes Anchor+PWC
  // WITH a length multiplier — we're deliberately keeping Anchor flat across
  // the board for consistency with the boat-pricing decision made earlier.
  // Flag this if that's not what you intended.)
  //
  // Pontoon Flagship base corrected 3100 -> 2700 (Aug '26): the old value
  // priced Flagship at or above Harbor + buying Detailing/Shrink Wrap/Lift
  // Cover separately ($1,000 in add-ons) for every pontoon length band, so
  // "upgrade to Flagship and save" was never actually true for pontoons.
  // 2700 brings the Harbor-vs-Flagship gap to $700, matching Ski/Inboard,
  // and produces a genuine $150-$350 savings across all standard length
  // bands (see the Flagship-savings callout on each boat card below).
  const BASE = {
    Anchor:   { SI: 900,  Pontoon: 750,  PWC: 350  },
    Harbor:   { SI: 2800, Pontoon: 2000, PWC: 650  },
    Flagship: { SI: 3500, Pontoon: 2700, PWC: 1100 },
  };
  const TIER_ORDER = ["Anchor", "Harbor", "Flagship"];
  const DRIVE_LABEL = { Outboard: "Outboard", IO: "I/O (Sterndrive)", Inboard: "Inboard / V-Drive" };
  const STYLE_LABEL = { Standup: "Stand-up", SitRec: "Sit-down (Recreation)", SitPerf: "Sit-down (Performance/Tow-Sport)" };
  const DRIVE_MULT = { Outboard: 0.90, IO: 1.10, Inboard: 1.10 };
  const STYLE_MULT = { Standup: 0.90, SitRec: 1.00, SitPerf: 1.10 };
  const PACKAGE_SERVICES = {
    Anchor: [
      "Engine winterization, including impeller replacement",
      "Fuel & battery prep",
      "On-site service call at your own lift or property"
    ],
    Harbor: [
      "Everything in Anchor",
      "Covered, secured storage for the season",
      "Pickup & delivery included in the spring"
    ],
    Flagship: [
      "Everything in Harbor",
      "Shrink wrapping",
      "Lift cover removal and install",
      "Full detail before spring delivery"
    ]
  };
  // What Flagship bundles for free, priced at Harbor's a-la-carte rate — this
  // is the basis for the "how much do you save with Flagship" comparison.
  const FLAGSHIP_BUNDLED_ADDON_TOTAL = 450 + 400 + 150; // Detailing + Shrink Wrap + Lift Cover

  function boatLengthMultiplier(ft, pkg) {
    // Anchor: flat rate regardless of length — no storage footprint to size for.
    if (pkg === "Anchor") {
      return { mult: 1.00, band: "Flat rate — customer's own storage", flat: true };
    }
    if (ft <= 20) return { mult: 0.90, band: "Up to 20'" };
    if (ft <= 24) return { mult: 1.00, band: "21'–24'" };
    if (ft <= 28) return { mult: 1.12, band: "25'–28'" };
    if (ft <= 32) return { mult: 1.20, band: "29'–32'" };
    return { mult: 1.50, band: "33'+ (custom quote)" };
  }

  function pwcLengthMultiplier(ft, pkg) {
    // Same flat-rate-at-Anchor logic as boats — see note above.
    if (pkg === "Anchor") {
      return { mult: 1.00, band: "Flat rate — customer's own storage", flat: true };
    }
    if (ft <= 10) return { mult: 0.90, band: "Up to 10' (e.g. Spark)" };
    if (ft <= 12) return { mult: 1.00, band: "11'–12' (e.g. GTI/GTR)" };
    return { mult: 1.12, band: "13'+ (performance/tow-sport)" };
  }

  function getLengthMultiplier(ft, pkg, cat) {
    return cat === "PWC" ? pwcLengthMultiplier(ft, pkg) : boatLengthMultiplier(ft, pkg);
  }

  function getSecondaryMultiplier(cat, drive, style) {
    if (cat === "Pontoon") return 1.00;
    if (cat === "PWC") return STYLE_MULT[style];
    return DRIVE_MULT[drive];
  }

  function catDisplayName(cat) {
    if (cat === "Pontoon") return "Pontoon";
    if (cat === "PWC") return "Jet Ski / PWC";
    return "Ski/Inboard";
  }

  function driveOrStyleLabel(cat, drive, style) {
    if (cat === "Pontoon") return "Pontoon";
    if (cat === "PWC") return STYLE_LABEL[style];
    return DRIVE_LABEL[drive];
  }

  function priceFor(pkg, cat, ft, drive, style) {
    const base = BASE[pkg][cat];
    const lm = getLengthMultiplier(ft, pkg, cat);
    const dm = getSecondaryMultiplier(cat, drive, style);
    const raw = base * lm.mult * dm;
    const rounded = Math.round(raw / 25) * 25;
    return { base, lm, dm, raw, rounded };
  }

  // How much a customer saves by choosing Flagship instead of Harbor plus
  // buying Detailing + Shrink Wrap + Lift Cover separately, for this boat's
  // exact length/drivetrain combo (same comparison the sales callout shows).
  function computeFlagshipSavings(cat, ft, drive, style) {
    const harbor = priceFor("Harbor", cat, ft, drive, style);
    const flagship = priceFor("Flagship", cat, ft, drive, style);
    const harborPlusAddOns = harbor.rounded + FLAGSHIP_BUNDLED_ADDON_TOTAL;
    const savings = harborPlusAddOns - flagship.rounded;
    return { harborPlusAddOns, flagshipRounded: flagship.rounded, savings };
  }

  const money = (n) => "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });

  // ---- BOAT CARD TEMPLATE ----
  function boatCardHtml() {
    return '' +
      '<div class="boat-card-head"><h2>Boat <span data-role="cardNum">1</span></h2>' +
        '<button type="button" class="remove-boat-btn" data-role="removeBtn">Remove this boat</button></div>' +
      '<div class="row" style="margin-bottom:14px;">' +
        '<div class="num-field"><label>Boat / make</label><input type="text" data-field="boatName" placeholder="—"></div>' +
        '<div class="num-field"><label>Desired pickup date</label><input type="date" data-field="pickupDate"></div>' +
      '</div>' +

      '<p class="field-label">Package</p>' +
      '<div class="btn-group" data-role="pkgGroup">' +
        '<div class="btn-opt" data-val="Anchor">Anchor<span class="sub">from $900 / $750 / $350 — flat rate, any length</span></div>' +
        '<div class="btn-opt active" data-val="Harbor">Harbor<span class="sub">from $2,800 / $2,000 / $650</span></div>' +
        '<div class="btn-opt" data-val="Flagship">Flagship<span class="sub">from $3,500 / $2,700 / $1,100</span></div>' +
      '</div>' +

      '<p class="field-label">Boat / PWC category</p>' +
      '<div class="btn-group" data-role="catGroup">' +
        '<div class="btn-opt active" data-val="SI">Ski / Inboard</div>' +
        '<div class="btn-opt" data-val="Pontoon">Pontoon</div>' +
        '<div class="btn-opt" data-val="PWC">Jet Ski / PWC</div>' +
      '</div>' +

      '<div data-role="driveWrap">' +
        '<p class="field-label">Drivetrain</p>' +
        '<div class="btn-group" data-role="driveGroup">' +
          '<div class="btn-opt active" data-val="Outboard">Outboard</div>' +
          '<div class="btn-opt" data-val="IO">I/O</div>' +
          '<div class="btn-opt" data-val="Inboard">Inboard / V-Drive</div>' +
        '</div>' +
      '</div>' +

      '<div data-role="styleWrap" style="display:none;">' +
        '<p class="field-label">Hull / riding style</p>' +
        '<div class="btn-group" data-role="styleGroup">' +
          '<div class="btn-opt active" data-val="Standup">Stand-up</div>' +
          '<div class="btn-opt" data-val="SitRec">Sit-down (Recreation)</div>' +
          '<div class="btn-opt" data-val="SitPerf">Sit-down (Perf./Tow-Sport)</div>' +
        '</div>' +
      '</div>' +

      '<div class="row">' +
        '<div class="num-field">' +
          '<label data-role="lengthLabel">Boat length (ft)</label>' +
          '<input type="number" data-field="lengthInput" value="24" min="8" max="60">' +
        '</div>' +
      '</div>' +
      '<p class="hint" data-role="lengthHint"></p>' +
      '<div class="warn" data-role="customQuoteWarn">33\'+ — recommend a custom quote rather than relying on the pricing table.</div>' +

      '<div class="savings-box" data-role="savingsBox"></div>' +

      '<p class="field-label" style="margin-top:18px;">Add-ons</p>' +

      '<div class="addon-row" data-role="row-detailing">' +
        '<input type="checkbox" data-field="add-detailing">' +
        '<div class="a-label"><b>Detailing</b><span class="a-note" data-role="note-detailing">Add-on for Anchor &amp; Harbor</span></div>' +
        '<div class="a-price">$450</div>' +
      '</div>' +

      '<div class="addon-row" data-role="row-wrap">' +
        '<input type="checkbox" data-field="add-wrap">' +
        '<div class="a-label"><b>Shrink wrapping</b><span class="a-note" data-role="note-wrap">Add-on for Anchor &amp; Harbor</span></div>' +
        '<div class="a-price">$400</div>' +
      '</div>' +

      '<div class="addon-row" data-role="row-liftcover">' +
        '<input type="checkbox" data-field="add-liftcover">' +
        '<div class="a-label"><b>Lift Cover removal and install</b><span class="a-note" data-role="note-liftcover">Available on any package</span></div>' +
        '<div class="a-price">$150</div>' +
      '</div>' +

      '<div class="addon-row">' +
        '<input type="checkbox" data-field="add-trailer">' +
        '<div class="a-label"><b>Trailer bearing &amp; tire check</b><span class="a-note">Range $75–150 — set exact amount</span></div>' +
        '<div class="a-price">$<input type="number" data-field="trailerAmt" value="75" min="75" max="150"></div>' +
      '</div>' +

      '<div class="addon-row">' +
        '<input type="checkbox" data-field="add-battery">' +
        '<div class="a-label"><b>Battery tender service</b><span class="a-note">$25–50 / battery — set count &amp; rate</span></div>' +
        '<div class="a-price">' +
          '<input type="number" data-field="batteryCount" value="1" min="0" max="12" style="width:44px;"> ×' +
          ' $<input type="number" data-field="batteryRate" value="25" min="25" max="50">' +
        '</div>' +
      '</div>' +

      '<div class="addon-row" data-role="row-impeller">' +
        '<input type="checkbox" data-field="add-impeller">' +
        '<div class="a-label"><b>Impeller replacement (Outboard / I-O)</b><span class="a-note" data-role="note-impeller">Recommended every 2–3 years — requires lower unit removal. Inboards get a new impeller yearly as part of standard winterization, so no add-on needed there.</span></div>' +
        '<div class="a-price">$150</div>' +
      '</div>' +

      '<div class="addon-row disabled">' +
        '<input type="checkbox" data-field="add-vent" disabled>' +
        '<div class="a-label"><b>Vent Kit + Moisture and Pest Deterrent</b><span class="a-note" data-role="note-vent">Automatic with any shrink-wrapped boat — no charge</span></div>' +
        '<div class="a-price">Free</div>' +
      '</div>' +

      '<div class="row" style="margin-top:16px;">' +
        '<div class="num-field">' +
          '<label>Battery storage direction (note only, not priced)</label>' +
          '<input type="text" data-field="batteryDirection" placeholder="e.g. customer takes battery home">' +
        '</div>' +
      '</div>' +

      '<p class="field-label" style="margin-top:18px;">Adjustments</p>' +
      '<div class="row" style="margin-bottom:14px;">' +
        '<div class="num-field">' +
          '<label>Discount ($ off total)</label>' +
          '<input type="number" data-field="discountAmt" value="0" min="0" step="25">' +
        '</div>' +
      '</div>' +
      '<div class="row" style="margin-bottom:10px;">' +
        '<label class="override-check">' +
          '<input type="checkbox" data-field="overrideToggle">' +
          ' Override total price (skip the math — set an exact quote)' +
        '</label>' +
      '</div>' +
      '<div class="row" data-role="overrideRow" style="display:none;">' +
        '<div class="num-field">' +
          '<label>Override total ($)</label>' +
          '<input type="number" data-field="overrideAmt" value="0" min="0" step="25">' +
        '</div>' +
      '</div>' +
      '<p class="hint" data-role="adjustHint"></p>' +

      '<div class="boat-mini-summary" data-role="boatSummary">' +
        '<div class="s-line"><span>Base price</span><b data-role="s-base">—</b></div>' +
        '<div class="s-line"><span>Length category</span><b data-role="s-lenmult">—</b></div>' +
        '<div class="s-line"><span>Drivetrain / style</span><b data-role="s-drivemult">—</b></div>' +
        '<div class="s-line"><span>Package subtotal</span><b data-role="s-pkgsub">—</b></div>' +
        '<div class="s-line"><span>Add-ons subtotal</span><b data-role="s-addsub">—</b></div>' +
        '<div class="s-line"><span>Discount</span><b data-role="s-discount">—</b></div>' +
        '<div class="s-total"><span class="label">Boat total</span><span class="amt" data-role="s-total">$0</span></div>' +
      '</div>';
  }

  let boatCards = [];
  let cardSeq = 0;

  function q(card, roleOrField, isField) {
    const attr = isField ? 'data-field' : 'data-role';
    return card.el.querySelector('[' + attr + '="' + roleOrField + '"]');
  }

  function createBoatCard(container) {
    cardSeq += 1;
    const el = document.createElement('div');
    el.className = 'card boat-card';
    el.innerHTML = boatCardHtml();
    container.appendChild(el);

    const card = {
      el: el,
      state: { pkg: 'Harbor', cat: 'SI', drive: 'Outboard', style: 'Standup' },
      existingBoatId: null,
      existingQuoteId: null,
      meta: null,
    };
    boatCards.push(card);
    wireCard(card);
    renumberCards();
    updateCardUI(card);
    return card;
  }

  function removeBoatCard(card) {
    if (boatCards.length <= 1) return;
    const idx = boatCards.indexOf(card);
    if (idx === -1) return;
    card.el.remove();
    boatCards.splice(idx, 1);
    renumberCards();
    recomputeAll();
  }

  function renumberCards() {
    boatCards.forEach((c, i) => {
      const numEl = q(c, 'cardNum');
      if (numEl) numEl.textContent = String(i + 1);
    });
  }

  function wireGroupOn(card, role, key) {
    const group = q(card, role);
    group.querySelectorAll('.btn-opt').forEach((el) => {
      el.addEventListener('click', () => {
        group.querySelectorAll('.btn-opt').forEach((o) => o.classList.remove('active'));
        el.classList.add('active');
        card.state[key] = el.dataset.val;
        updateCardUI(card);
        updateGrandSummary();
      });
    });
  }

  function wireCard(card) {
    wireGroupOn(card, 'pkgGroup', 'pkg');
    wireGroupOn(card, 'catGroup', 'cat');
    wireGroupOn(card, 'driveGroup', 'drive');
    wireGroupOn(card, 'styleGroup', 'style');

    const fieldIds = [
      'lengthInput', 'trailerAmt', 'batteryCount', 'batteryRate',
      'add-detailing', 'add-wrap', 'add-liftcover', 'add-trailer', 'add-battery', 'add-impeller',
      'discountAmt', 'overrideAmt', 'overrideToggle',
    ];
    fieldIds.forEach((f) => {
      const el = q(card, f, true);
      el.addEventListener('input', () => { updateCardUI(card); updateGrandSummary(); });
      el.addEventListener('change', () => { updateCardUI(card); updateGrandSummary(); });
    });

    q(card, 'removeBtn').addEventListener('click', () => removeBoatCard(card));
  }

  function computeCardPrice(card) {
    const ft = parseFloat(q(card, 'lengthInput', true).value || 0);
    const p = priceFor(card.state.pkg, card.state.cat, ft, card.state.drive, card.state.style);
    return { ft: ft, base: p.base, lm: p.lm, dm: p.dm, raw: p.raw, rounded: p.rounded };
  }

  function updateCardUI(card) {
    q(card, 'driveWrap').style.display = card.state.cat === 'SI' ? 'block' : 'none';
    q(card, 'styleWrap').style.display = card.state.cat === 'PWC' ? 'block' : 'none';

    const lengthEl = q(card, 'lengthInput', true);
    if (card.state.cat === 'PWC') {
      lengthEl.min = 6; lengthEl.max = 20;
      q(card, 'lengthLabel').textContent = 'PWC length (ft)';
    } else {
      lengthEl.min = 8; lengthEl.max = 60;
      q(card, 'lengthLabel').textContent = 'Boat length (ft)';
    }

    const flagship = card.state.pkg === 'Flagship';
    const DEFAULT_NOTE = {
      detailing: 'Add-on for Anchor & Harbor',
      wrap: 'Add-on for Anchor & Harbor',
      liftcover: 'Available on any package',
    };
    ['detailing', 'wrap', 'liftcover'].forEach((k) => {
      const cb = q(card, 'add-' + k, true);
      const row = q(card, 'row-' + k);
      const note = q(card, 'note-' + k);
      if (flagship) {
        cb.checked = true; cb.disabled = true; row.classList.add('disabled');
        note.textContent = 'Included free in Flagship';
      } else {
        cb.disabled = false; row.classList.remove('disabled');
        note.textContent = DEFAULT_NOTE[k];
      }
    });
    q(card, 'note-vent').textContent = q(card, 'add-wrap', true).checked
      ? 'Included automatically — no charge' : 'Only applies once shrink wrapping is included';

    // Impeller replacement add-on only makes sense for Outboard/I-O drivetrains
    // (Inboards get one every year as part of standard winterization already;
    // Pontoons are commonly outboard-powered too, so it's offered there as well).
    const showImpeller = card.state.cat === 'Pontoon' || (card.state.cat === 'SI' && card.state.drive !== 'Inboard');
    const impellerRow = q(card, 'row-impeller');
    const impellerCb = q(card, 'add-impeller', true);
    if (showImpeller) {
      impellerRow.classList.remove('disabled');
      impellerCb.disabled = false;
    } else {
      impellerCb.checked = false;
      impellerCb.disabled = true;
      impellerRow.classList.add('disabled');
    }

    const priced = computeCardPrice(card);
    const ft = priced.ft;
    q(card, 'customQuoteWarn').classList.toggle('show', card.state.cat !== 'PWC' && ft >= 33 && card.state.pkg !== 'Anchor');
    q(card, 'lengthHint').textContent = priced.lm.flat
      ? "Flat rate — no per-foot charge (serviced at customer's own storage)"
      : 'Length category: ' + priced.lm.band;

    let addons = 0;
    const lines = [];
    if (q(card, 'add-detailing', true).checked && !flagship) { addons += 450; lines.push(['Detailing', 450]); }
    if (flagship) lines.push(['Detailing (included in Flagship)', 0]);
    if (q(card, 'add-wrap', true).checked && !flagship) { addons += 400; lines.push(['Shrink wrapping', 400]); }
    if (flagship) lines.push(['Shrink wrapping (included in Flagship)', 0]);
    if (q(card, 'add-liftcover', true).checked && !flagship) { addons += 150; lines.push(['Lift Cover removal and install', 150]); }
    if (flagship) lines.push(['Lift Cover removal and install (included in Flagship)', 0]);
    if (q(card, 'add-trailer', true).checked) {
      const amt = parseFloat(q(card, 'trailerAmt', true).value || 0);
      addons += amt; lines.push(['Trailer bearing & tire check', amt]);
    }
    if (q(card, 'add-battery', true).checked) {
      const count = parseFloat(q(card, 'batteryCount', true).value || 0);
      const rate = parseFloat(q(card, 'batteryRate', true).value || 0);
      const amt = count * rate;
      addons += amt; lines.push(['Battery tender service (' + count + ' × $' + rate + ')', amt]);
    }
    if (q(card, 'add-impeller', true).checked && showImpeller) {
      addons += 150; lines.push(['Impeller replacement (Outboard/I-O)', 150]);
    }

    const overrideOn = q(card, 'overrideToggle', true).checked;
    const discount = parseFloat(q(card, 'discountAmt', true).value || 0);
    const overrideAmt = parseFloat(q(card, 'overrideAmt', true).value || 0);
    q(card, 'overrideRow').style.display = overrideOn ? 'flex' : 'none';
    q(card, 'discountAmt', true).disabled = overrideOn;

    const subtotal = priced.rounded + addons;
    let total;
    if (overrideOn) {
      total = overrideAmt;
      q(card, 's-discount').textContent = 'Override active';
      q(card, 'adjustHint').textContent = 'Manual override — the pricing math above is ignored for the final total.';
    } else {
      total = Math.max(0, subtotal - discount);
      q(card, 's-discount').textContent = discount > 0 ? '-' + money(discount) : '—';
      q(card, 'adjustHint').textContent = '';
    }

    q(card, 's-base').textContent = money(priced.base) + ' (' + catDisplayName(card.state.cat) + ')';
    q(card, 's-lenmult').textContent = priced.lm.flat ? 'Flat rate (own storage)' : priced.lm.band;
    q(card, 's-drivemult').textContent = driveOrStyleLabel(card.state.cat, card.state.drive, card.state.style);
    q(card, 's-pkgsub').textContent = money(priced.rounded);
    q(card, 's-addsub').textContent = money(addons);
    q(card, 's-total').textContent = money(total);

    // Flagship savings callout — always shown (regardless of the currently
    // selected package) so staff can use it as a talking point when quoting
    // Anchor/Harbor, and to confirm the savings when Flagship is selected.
    const savingsBox = q(card, 'savingsBox');
    if (card.state.pkg === 'Anchor') {
      savingsBox.classList.remove('show', 'negative');
      savingsBox.innerHTML = '';
    } else {
      const sv = computeFlagshipSavings(card.state.cat, ft, card.state.drive, card.state.style);
      savingsBox.classList.add('show');
      if (sv.savings >= 0) {
        savingsBox.classList.remove('negative');
        savingsBox.innerHTML = '<b>Flagship saves ' + money(sv.savings) + '</b> vs. Harbor + Detailing + Shrink Wrap + Lift Cover bought separately (' +
          money(sv.harborPlusAddOns) + ' vs. ' + money(sv.flagshipRounded) + ' for Flagship) at this length/drivetrain.';
      } else {
        savingsBox.classList.add('negative');
        savingsBox.innerHTML = '<b>Heads up:</b> at this length/drivetrain, Flagship (' + money(sv.flagshipRounded) +
          ') costs ' + money(Math.abs(sv.savings)) + ' more than Harbor + those same add-ons separately (' + money(sv.harborPlusAddOns) + ').';
      }
    }

    const idx = TIER_ORDER.indexOf(card.state.pkg);
    card.meta = {
      ft: ft, base: priced.base, lm: priced.lm, dm: priced.dm, rounded: priced.rounded,
      addons: addons, lines: lines, subtotal: subtotal, discount: discount,
      overrideOn: overrideOn, overrideAmt: overrideAmt, total: total,
      pkg: card.state.pkg, cat: card.state.cat, drive: card.state.drive, style: card.state.style,
    };
  }

  function recomputeAll() {
    boatCards.forEach(updateCardUI);
    updateGrandSummary();
  }

  function updateGrandSummary() {
    const linesEl = document.getElementById('grandLines');
    let grand = 0;
    linesEl.innerHTML = boatCards.map((card, i) => {
      const m = card.meta;
      grand += m ? m.total : 0;
      const boatName = q(card, 'boatName', true).value || ('Boat ' + (i + 1));
      return '<div class="s-line"><span>' + boatName + ' — ' + m.pkg + '</span><b>' + money(m.total) + '</b></div>';
    }).join('');
    document.getElementById('grandTotal').textContent = money(grand);
  }

  function boatQuoteText(card, idx) {
    const m = card.meta;
    const lines = m.lines.filter((l) => l[1] > 0);
    const secondaryLabel = m.cat === 'Pontoon' ? '' : ', ' + driveOrStyleLabel(m.cat, m.drive, m.style);
    const boatName = q(card, 'boatName', true).value || ('Boat ' + (idx + 1));
    const pickup = q(card, 'pickupDate', true).value || '—';
    const battDir = q(card, 'batteryDirection', true).value || '—';

    let txt = 'Boat ' + (idx + 1) + ': ' + boatName + '\n';
    txt += 'Desired pickup date: ' + pickup + '\n';
    txt += 'Package: ' + m.pkg + ' (' + catDisplayName(m.cat) + secondaryLabel + '), ' + m.ft + 'ft\n';
    txt += 'Base ' + money(m.base) + (m.lm.flat ? ' (flat rate, own storage)' : ' — ' + m.lm.band) + ' = ' + money(m.rounded) + '\n';
    if (lines.length) {
      txt += 'Add-ons:\n';
      lines.forEach((l) => { txt += '  ' + l[0] + ' — ' + money(l[1]) + '\n'; });
    }
    if (battDir !== '—') txt += 'Battery storage: ' + battDir + '\n';
    if (m.overrideOn) {
      txt += 'MANUAL OVERRIDE — computed subtotal was ' + money(m.subtotal) + '\n';
    } else if (m.discount > 0) {
      txt += 'Subtotal before discount: ' + money(m.subtotal) + '\n';
      txt += 'Discount: -' + money(m.discount) + '\n';
    }
    txt += 'Boat total: ' + money(m.total) + '\n';
    return txt;
  }

  function buildAllQuotesText() {
    const cust = document.getElementById('custName').value || '—';
    const date = document.getElementById('quoteDate').value || '—';
    const staff = document.getElementById('staffName').value || '—';
    const address = document.getElementById('custAddress').value || '—';

    let txt = 'WATERLINE LAKE SERVICES — QUOTE\n';
    txt += 'Customer: ' + cust + '\n';
    txt += 'Address: ' + address + '\n';
    txt += 'Date: ' + date + '   Staff: ' + staff + '\n\n';

    let grand = 0;
    boatCards.forEach((card, i) => {
      txt += boatQuoteText(card, i) + '\n';
      grand += card.meta.total;
    });
    txt += 'GRAND TOTAL (' + boatCards.length + (boatCards.length === 1 ? ' boat' : ' boats') + '): ' + money(grand) + '\n';
    return txt;
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    const txt = buildAllQuotesText();
    navigator.clipboard.writeText(txt).then(() => {
      document.getElementById('copyStatus').textContent = 'Copied to clipboard.';
      setTimeout(() => { document.getElementById('copyStatus').textContent = ''; }, 2500);
    }).catch(() => {
      document.getElementById('copyStatus').textContent = "Couldn't copy — select and copy manually.";
    });
  });

  // ---- BRANDED PDF EXPORT (one combined PDF covering every boat) ----
  function buildCombinedQuotePdf(quoteLinks) {
    const cust = document.getElementById('custName').value || 'Customer';
    const phone = document.getElementById('custPhone').value || '—';
    const email = document.getElementById('custEmail').value || '—';
    const address = document.getElementById('custAddress').value || '—';
    const date = document.getElementById('quoteDate').value || new Date().toLocaleDateString('en-US');
    const staff = document.getElementById('staffName').value || '—';

    const doc = new jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const DEEP = [19, 78, 94];
    const GLACIER = [140, 199, 214];
    const INK = [22, 35, 43];
    const MUTED = [106, 116, 128];
    let y = 0;

    function ensureSpace(needed) {
      if (y + needed > pageHeight - 50) {
        doc.addPage();
        y = 50;
      }
    }

    function drawHeader() {
      doc.setFillColor(DEEP[0], DEEP[1], DEEP[2]);
      doc.rect(0, 0, pageWidth, 86, 'F');
      doc.setFillColor(GLACIER[0], GLACIER[1], GLACIER[2]);
      doc.rect(0, 86, pageWidth, 4, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(22);
      doc.text('Waterline Lake Services', 40, 40);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(215, 231, 236);
      doc.text('Boat Winterization, Storage, Detailing & Lake Services – Indiana Lake Communities', 40, 58);

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(255, 255, 255);
      doc.text('QUOTE', pageWidth - 40, 40, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(215, 231, 236);
      doc.text('Date: ' + date, pageWidth - 40, 56, { align: 'right' });
    }

    drawHeader();
    y = 118;
    doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11.5);
    doc.text('Prepared for', 40, y);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    y += 17;
    doc.text(cust, 40, y); y += 15;
    doc.text('Address: ' + address, 40, y); y += 15;
    doc.text('Phone: ' + phone, 40, y); y += 15;
    doc.text('Email: ' + email, 40, y);

    let y2 = 118;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11.5);
    doc.text('Prepared by', pageWidth - 220, y2);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    y2 += 17;
    doc.text('Staff: ' + staff, pageWidth - 220, y2); y2 += 15;
    doc.text('Waterline Lake Services LLC', pageWidth - 220, y2); y2 += 15;
    doc.text('service@waterlinelakeservices.com', pageWidth - 220, y2); y2 += 15;
    doc.text('317-258-8269', pageWidth - 220, y2);

    y = Math.max(y, y2) + 28;

    function row(label, value, bold) {
      doc.setFont('helvetica', bold ? 'bold' : 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.text(label, 40, y);
      doc.text(value, pageWidth - 40, y, { align: 'right' });
      y += 18;
    }

    let grandTotal = 0;

    boatCards.forEach((card, i) => {
      const m = card.meta;
      const boatName = q(card, 'boatName', true).value || ('Boat ' + (i + 1));
      const pickup = q(card, 'pickupDate', true).value || '';
      const battDir = q(card, 'batteryDirection', true).value || '';
      const lines = m.lines.filter((l) => l[1] > 0);
      grandTotal += m.total;

      ensureSpace(60);
      doc.setDrawColor(220, 225, 228);
      doc.line(40, y, pageWidth - 40, y);
      y += 22;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(DEEP[0], DEEP[1], DEEP[2]);
      doc.text('Boat ' + (i + 1) + ': ' + boatName + ' — ' + m.pkg + ' package', 40, y);
      y += 17;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      const catLabel = m.cat === 'Pontoon' ? 'Pontoon'
        : m.cat === 'PWC' ? 'Jet Ski / PWC — ' + STYLE_LABEL[m.style]
        : 'Ski / Inboard — ' + DRIVE_LABEL[m.drive];
      doc.text(catLabel + ', ' + m.ft + ' ft' + (pickup ? ' — desired pickup: ' + pickup : ''), 40, y);
      y += 24;

      row('Base price (' + catDisplayName(m.cat) + ')', money(m.base));
      if (!m.lm.flat) {
        row('Length category (' + m.lm.band + ')', ' ');
      } else {
        row('Length', 'Flat rate — own storage');
      }
      if (m.cat === 'PWC') {
        row('Hull / riding style', STYLE_LABEL[m.style]);
      } else if (m.cat !== 'Pontoon') {
        row('Drivetrain', DRIVE_LABEL[m.drive]);
      }
      doc.setDrawColor(230, 234, 236);
      doc.line(40, y, pageWidth - 40, y);
      y += 4;
      row('Package subtotal', money(m.rounded), true);
      y += 4;

      if (lines.length) {
        ensureSpace(16 + lines.length * 18);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor(INK[0], INK[1], INK[2]);
        doc.text('Add-ons', 40, y);
        y += 16;
        lines.forEach((l) => { ensureSpace(18); row(l[0], money(l[1])); });
      }
      if (battDir) {
        ensureSpace(18);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9.5);
        doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text('Battery storage: ' + battDir, 40, y);
        y += 18;
      }
      if (!m.overrideOn && m.discount > 0) {
        ensureSpace(22);
        doc.setDrawColor(230, 234, 236);
        doc.line(40, y, pageWidth - 40, y);
        y += 4;
        row('Discount', '-' + money(m.discount));
      }

      ensureSpace(40);
      y += 6;
      doc.setFillColor(DEEP[0], DEEP[1], DEEP[2]);
      doc.rect(40, y, pageWidth - 80, 34, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.text('BOAT TOTAL', 54, y + 22);
      doc.setFontSize(15);
      doc.text(money(m.total), pageWidth - 54, y + 23, { align: 'right' });
      y += 34 + 14;

      if (m.overrideOn) {
        ensureSpace(16);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(8.5);
        doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text('This total was set manually by staff (standard pricing would have been ' + money(m.subtotal) + ').', 40, y);
        y += 16;
      }

      const services = PACKAGE_SERVICES[m.pkg] || [];
      if (services.length) {
        ensureSpace(18 + services.length * 14);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(DEEP[0], DEEP[1], DEEP[2]);
        doc.text("What's included in " + m.pkg, 40, y);
        y += 15;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor(INK[0], INK[1], INK[2]);
        services.forEach((s) => {
          doc.text('•  ' + s, 46, y, { maxWidth: pageWidth - 90 });
          y += 14;
        });
      }

      const link = quoteLinks && quoteLinks[i];
      if (link) {
        ensureSpace(20);
        y += 6;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9.5);
        doc.setTextColor(DEEP[0], DEEP[1], DEEP[2]);
        doc.text('Accept this boat online: ', 40, y);
        const labelWidth = doc.getTextWidth('Accept this boat online: ');
        doc.setFont('helvetica', 'normal');
        doc.textWithLink(link, 40 + labelWidth, y, { url: link });
        y += 18;
      }
      y += 10;
    });

    ensureSpace(60);
    doc.setDrawColor(220, 225, 228);
    doc.line(40, y, pageWidth - 40, y);
    y += 22;
    doc.setFillColor(DEEP[0], DEEP[1], DEEP[2]);
    doc.rect(40, y, pageWidth - 80, 46, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('GRAND TOTAL (' + boatCards.length + (boatCards.length === 1 ? ' boat' : ' boats') + ')', 56, y + 29);
    doc.setFontSize(20);
    doc.text(money(grandTotal), pageWidth - 56, y + 30, { align: 'right' });
    y += 46 + 26;

    ensureSpace(60);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
    doc.text(
      'This quote is valid for 14 days from the date above. No mileage surcharge across the Indiana lake communities we serve.',
      40, y, { maxWidth: pageWidth - 80 }
    );
    y += 30;

    ensureSpace(60);
    doc.setDrawColor(180, 190, 195);
    doc.line(40, y, 260, y);
    doc.line(300, y, pageWidth - 40, y);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
    doc.text('Customer signature (acceptance of quote)', 40, y + 13);
    doc.text('Date', 300, y + 13);

    const fname = 'Waterline-Quote-' + cust.replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') + '.pdf';
    doc.save(fname || 'Waterline-Quote.pdf');
  }

  // ---- SAVE TO CRM + PDF (one Save click covers every boat card) ----
  document.getElementById('saveBtn').addEventListener('click', () => {
    const saveStatus = document.getElementById('saveStatus');
    const cust = document.getElementById('custName').value.trim();
    if (!cust) {
      saveStatus.style.color = '#F0B4A6';
      saveStatus.textContent = 'Add a customer name first.';
      return;
    }

    recomputeAll();

    const boatsPayload = boatCards.map((card, i) => {
      const m = card.meta;
      const showImpeller = card.state.cat === 'Pontoon' || (card.state.cat === 'SI' && card.state.drive !== 'Inboard');
      const addOns = [];
      if (q(card, 'add-detailing', true).checked) addOns.push('Detailing');
      if (q(card, 'add-wrap', true).checked) addOns.push('Shrink Wrapping');
      if (q(card, 'add-liftcover', true).checked) addOns.push('Lift Cover Install');
      if (q(card, 'add-trailer', true).checked) addOns.push('Trailer Bearing & Tire Check');
      if (q(card, 'add-battery', true).checked) addOns.push('Battery Tender Service');
      if (q(card, 'add-impeller', true).checked && showImpeller) addOns.push('Impeller Replacement');

      return {
        existingBoatId: card.existingBoatId || null,
        existingQuoteId: card.existingQuoteId || null,
        boatName: q(card, 'boatName', true).value,
        boatCategory: card.state.cat,
        boatLength: q(card, 'lengthInput', true).value,
        driveOrStyle: driveOrStyleLabel(card.state.cat, card.state.drive, card.state.style),
        package: card.state.pkg,
        pickupDate: q(card, 'pickupDate', true).value,
        addOns: addOns,
        discount: m.discount,
        overrideOn: m.overrideOn,
        total: m.total,
        quoteText: boatQuoteText(card, i),
      };
    });

    const payload = {
      customerId: window._customerId || null,
      customerName: cust,
      phone: document.getElementById('custPhone').value,
      email: document.getElementById('custEmail').value,
      address: document.getElementById('custAddress').value,
      boats: boatsPayload,
    };

    saveStatus.style.color = 'var(--glacier)';
    saveStatus.textContent = 'Saving to CRM…';
    document.getElementById('quoteLinksBox').style.display = 'none';

    fetch('/api/save-internal-quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then((res) => {
        if (!res.ok) { throw new Error('Request failed'); }
        return res.json();
      })
      .then((data) => {
        window._customerId = data.customerId;
        const quoteLinks = (data.boats || []).map((b) => b.quoteLink);
        (data.boats || []).forEach((b, i) => {
          if (boatCards[i]) {
            boatCards[i].existingBoatId = b.boatId;
            boatCards[i].existingQuoteId = b.quoteId;
          }
        });

        buildCombinedQuotePdf(quoteLinks);
        saveStatus.style.color = 'var(--glacier)';
        saveStatus.textContent = 'Saved to CRM ✓ — PDF downloaded.';

        const linksList = document.getElementById('quoteLinksList');
        linksList.innerHTML = (data.boats || []).map((b, i) => {
          const name = q(boatCards[i], 'boatName', true).value || ('Boat ' + (i + 1));
          return '<div style="display:flex; gap:6px; margin-bottom:6px;">' +
            '<input type="text" readonly value="' + b.quoteLink + '" style="flex:1; font-size:11.5px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.95); color:#16232B;">' +
            '</div>';
        }).join('');
        if (quoteLinks.length) document.getElementById('quoteLinksBox').style.display = 'block';
      })
      .catch(() => {
        // Still get the staff a PDF even if the CRM write failed — just
        // without live links, since no quote records exist to point at.
        buildCombinedQuotePdf(null);
        saveStatus.style.color = '#F0B4A6';
        saveStatus.textContent = 'PDF downloaded, but the CRM save failed — add these in Airtable manually.';
      });
  });

  // ---- PREFILL FROM A LINK ----
  // requestId (a Quote record id from its "Internal Tool Link") loads the
  // WHOLE customer: every boat they have on file gets its own card here, so
  // staff can review/adjust all of them from one link, not just the boat
  // tied to whichever quote was clicked. Saving afterwards updates those
  // same Customer/Boat/Quote records rather than creating new ones.
  function applyBoatTypeToCategory(card, boatType) {
    let cat = 'SI';
    if (boatType.indexOf('Pontoon') !== -1) cat = 'Pontoon';
    else if (boatType.indexOf('Jet Ski') !== -1 || boatType.indexOf('PWC') !== -1) cat = 'PWC';
    card.state.cat = cat;
    q(card, 'catGroup').querySelectorAll('.btn-opt').forEach((el) => {
      el.classList.toggle('active', el.dataset.val === cat);
    });
  }
  function applyDriveOrStyle(card, label) {
    if (!label) return;
    if (card.state.cat === 'PWC') {
      const styleKey = Object.keys(STYLE_LABEL).find((k) => STYLE_LABEL[k] === label);
      if (styleKey) {
        card.state.style = styleKey;
        q(card, 'styleGroup').querySelectorAll('.btn-opt').forEach((el) => {
          el.classList.toggle('active', el.dataset.val === styleKey);
        });
      }
    } else if (card.state.cat !== 'Pontoon') {
      const driveKey = Object.keys(DRIVE_LABEL).find((k) => DRIVE_LABEL[k] === label);
      if (driveKey) {
        card.state.drive = driveKey;
        q(card, 'driveGroup').querySelectorAll('.btn-opt').forEach((el) => {
          el.classList.toggle('active', el.dataset.val === driveKey);
        });
      }
    }
  }
  function applyPackage(card, pkg) {
    if (pkg && BASE[pkg]) {
      card.state.pkg = pkg;
      q(card, 'pkgGroup').querySelectorAll('.btn-opt').forEach((el) => {
        el.classList.toggle('active', el.dataset.val === pkg);
      });
    }
  }
  // Maps the Add-ons values as stored in Airtable back to this tool's
  // checkbox fields, so a website inquiry's requested add-ons come in
  // pre-checked. Only touches checkboxes that aren't currently disabled
  // (e.g. skips Detailing/Shrink wrap/Lift cover when Flagship already
  // forces them on).
  const ADDON_CHECKBOX_FIELD = {
    'Detailing': 'add-detailing',
    'Shrink Wrapping': 'add-wrap',
    'Lift Cover Install': 'add-liftcover',
    'Trailer Bearing & Tire Check': 'add-trailer',
    'Battery Tender Service': 'add-battery',
    'Impeller Replacement': 'add-impeller',
  };
  function applyAddOns(card, addOns) {
    (addOns || []).forEach((name) => {
      const field = ADDON_CHECKBOX_FIELD[name];
      const el = field && q(card, field, true);
      if (el && !el.disabled) el.checked = true;
    });
  }
  function showLoadedBanner(text, isError) {
    const el = document.getElementById('loadedBanner');
    el.textContent = text;
    el.style.background = isError ? '#FCEFEA' : '';
    el.style.color = isError ? '#8A3E22' : '';
    el.style.display = 'block';
  }

  function prefillCardFromBoat(card, boatData) {
    if (boatData.boatId) card.existingBoatId = boatData.boatId;
    if (boatData.quoteId) card.existingQuoteId = boatData.quoteId;
    if (boatData.boatName) q(card, 'boatName', true).value = boatData.boatName;
    if (boatData.boatLength) q(card, 'lengthInput', true).value = boatData.boatLength;
    if (boatData.pickupDate) q(card, 'pickupDate', true).value = boatData.pickupDate;
    if (boatData.boatType) applyBoatTypeToCategory(card, boatData.boatType);
    if (boatData.package) applyPackage(card, boatData.package);
    updateCardUI(card); // rebuild add-on disabled states for the now-current package/category first
    if (boatData.style) applyDriveOrStyle(card, boatData.style);
    applyAddOns(card, boatData.addOns);
    if (boatData.overrideOn) {
      q(card, 'overrideToggle', true).checked = true;
      if (boatData.quotedTotal) q(card, 'overrideAmt', true).value = boatData.quotedTotal;
    } else if (boatData.discount) {
      q(card, 'discountAmt', true).value = boatData.discount;
    }
    updateCardUI(card);
  }

  const container = document.getElementById('boatCardsContainer');

  (function prefillFromQuery() {
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('requestId');

    if (requestId) {
      showLoadedBanner('Loading the customer’s full boat list…');
      fetch('/api/get-quote-request?id=' + encodeURIComponent(requestId))
        .then((res) => {
          if (!res.ok) { throw new Error('Request failed'); }
          return res.json();
        })
        .then((data) => {
          if (!data.ok) { throw new Error('Not found'); }
          window._customerId = data.customerId || null;
          if (data.name) document.getElementById('custName').value = data.name;
          if (data.phone) document.getElementById('custPhone').value = data.phone;
          if (data.email) document.getElementById('custEmail').value = data.email;
          if (data.address) document.getElementById('custAddress').value = data.address;

          const boats = (data.boats && data.boats.length) ? data.boats : [{}];
          boats.forEach((boatData) => {
            const card = createBoatCard(container);
            prefillCardFromBoat(card, boatData);
          });
          recomputeAll();

          const boatWord = boats.length === 1 ? 'boat' : 'boats';
          showLoadedBanner(
            'Loaded ' + boats.length + ' ' + boatWord + ' for ' + (data.name || 'this customer') +
            ' — saving will update these same records, not create new ones.'
          );
        })
        .catch(() => {
          createBoatCard(container);
          recomputeAll();
          showLoadedBanner("Couldn't load that request automatically — double-check the name/phone/email below, or fill in from scratch.", true);
        });
      return; // requestId takes priority over the simpler param-based prefill below
    }

    const card = createBoatCard(container);
    recomputeAll();

    const textMap = { name: 'custName', phone: 'custPhone', email: 'custEmail', address: 'custAddress' };
    Object.keys(textMap).forEach((key) => {
      const val = params.get(key);
      if (val) { document.getElementById(textMap[key]).value = val; }
    });
    const lengthVal = params.get('length');
    if (lengthVal) q(card, 'lengthInput', true).value = lengthVal;
    const boatType = params.get('boatType');
    if (boatType) applyBoatTypeToCategory(card, boatType);
    applyPackage(card, params.get('package'));
    recomputeAll();
  })();

  document.getElementById('addBoatBtn').addEventListener('click', () => {
    createBoatCard(container);
    recomputeAll();
  });
</script>

</body>
</html>
