[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/submit-quote"
  to = "/.netlify/functions/submit-quote"
  status = 200

[[redirects]]
  from = "/api/save-internal-quote"
  to = "/.netlify/functions/save-internal-quote"
  status = 200

[[redirects]]
  from = "/api/accept-quote"
  to = "/.netlify/functions/accept-quote"
  status = 200

[[redirects]]
  from = "/quote"
  to = "/.netlify/functions/quote-page"
  status = 200

[[redirects]]
  from = "/api/get-quote-request"
  to = "/.netlify/functions/get-quote-request"
  status = 200

[[headers]]
  for = "/internalquote/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/quote"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- Winterization checklist (staff only) ---
[[redirects]]
  from = "/api/winterize"
  to = "/.netlify/functions/winterize"
  status = 200

[[headers]]
  for = "/winterize"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

[[headers]]
  for = "/winterize/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

# --- Boat check-in (staff) and customer agreement ---
[[redirects]]
  from = "/api/agreement"
  to = "/.netlify/functions/agreement"
  status = 200

# Check-in now lives inside /winterize (Check-in tab). Old links still work.
[[redirects]]
  from = "/checkin/*"
  to = "/winterize/"
  status = 301

[[redirects]]
  from = "/checkin"
  to = "/winterize/"
  status = 301

[[headers]]
  for = "/agreement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

[[headers]]
  for = "/agreement/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
